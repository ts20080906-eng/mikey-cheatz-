<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial,sans-serif;
}

.profile-box{
    width:420px;
    margin:80px auto;
    background:rgba(7,20,38,.9);
    border:1px solid #0066ff;
    border-radius:20px;
    padding:35px;
    text-align:center;
    box-shadow:0 0 25px #0066ff;
}

.profile-img{
    width:100px;
    height:100px;
    border-radius:50%;
    background:#00aaff;
    color:white;
    font-size:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
    margin-bottom:20px;
}

.profile-box h2{
    color:#00aaff;
    margin-bottom:25px;
}

.info{
    background:#0b1b33;
    border-radius:10px;
    padding:15px;
    margin-top:15px;
    font-size:18px;
}

.back-btn{
    display:inline-block;
    margin-top:25px;
    padding:10px 25px;
    background:#0066ff;
    color:white;
    text-decoration:none;
    border-radius:10px;
}

.back-btn:hover{
    background:#00aaff;
    color:white;
}

</style>

</head>

<body>

<div class="profile-box">

<div class="profile-img">
👤
</div>

<h2>My Profile</h2>

<div class="info">
<b>Name :</b> ??
</div>

<div class="info">
<b>PC Space :</b>??
</div>

<a href="loging.html" class="back-btn">
⬅ Dashboard
</a>

</div>

</body>
</html>
