<style>
.login-box h2{
    font-size:30px !important;
    font-weight:900 !important;
    color:#00BFFF !important;
    text-align:center;
    margin-bottom:25px;
    text-transform:uppercase;
    letter-spacing:3px;
    line-height:1.1;
}

























































/* Top Logo */
.top-logo{
    position:fixed;
    top:20px;
    left:20px;
    display:flex;
    align-items:center;
    gap:10px;
    z-index:1000;
}

.top-logo img{
    width:50px;
    height:50px;
    border-radius:50%;
    box-shadow:0 0 20px #00aaff;
}

.top-logo span{
    color:#00aaff;
    font-size:22px;
    font-weight:bold;
    text-shadow:0 0 15px #00aaff;
}

/* WhatsApp */
.whatsapp-btn{
    position:fixed;
    top:20px;
    right:20px;
    text-decoration:none;
    background:#25D366;
    color:#fff;
    padding:12px 20px;
    border-radius:30px;
    font-weight:bold;
    box-shadow:0 0 20px #25D366;
    transition:.3s;
    z-index:1000;
}

.whatsapp-btn:hover{
    transform:scale(1.1);
    box-shadow:0 0 35px #25D366;
}

/* Cursor */
body{
    cursor:none;
}

.cursor{
    width:18px;
    height:18px;
    border:2px solid #00aaff;
    border-radius:50%;
    position:fixed;
    pointer-events:none;
    transform:translate(-50%,-50%);
    box-shadow:0 0 20px #00aaff;
    z-index:9999;
}














*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
    background:#020617;
}

/* Animated Background */
body::before{
    content:"";
    position:fixed;
    width:200%;
    height:200%;
    background:
    radial-gradient(circle,#00aaff 2px,transparent 2px),
    radial-gradient(circle,#0066ff 2px,transparent 2px);
    background-size:80px 80px,140px 140px;
    animation:bgMove 18s linear infinite;
    opacity:.35;
}

@keyframes bgMove{
    from{
        transform:translate(0,0);
    }
    to{
        transform:translate(-250px,-250px);
    }
}

/* Floating Glow */
.glow{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    animation:float 8s ease-in-out infinite;
}

.g1{
    width:250px;
    height:250px;
    background:#00aaff;
    top:10%;
    left:10%;
}

.g2{
    width:300px;
    height:300px;
    background:#0044ff;
    bottom:10%;
    right:10%;
    animation-delay:3s;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-40px);
    }
}

.login-box{
    width:500px;         
    padding:50px;       
    border-radius:25px;
    background:rgba(7,20,38,.90);
    backdrop-filter:blur(18px);
    border:2px solid #00aaff;
    box-shadow:0 0 40px #00aaff;
    animation:fadeIn 1.2s ease;
    z-index:5;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.login-box h2{
    text-align:center;
    color:#00aaff;
    margin-bottom:65px;
    text-shadow:0 0 60px #00aaff;
}

input{
    width:100%;
    padding:18px;
    margin:18px 0;
    border:none;
    outline:none;
    border-radius:10px;
    background:#02111f;
    color:#fff;
    border:1px solid #0066ff;
}

input:focus{
    box-shadow:0 0 15px #00aaff;
}

button{
    width:100%;
    padding:18px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    background:#0066ff;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#00aaff;
    box-shadow:0 0 20px #00aaff;
    transform:scale(1.03);
}

.logo{
    text-align:center;
    font-size:35px;
    margin-bottom:10px;
}
</style>

</head>
<body>

</div>

<!-- Top Left Logo -->
<div class="top-logo">
    <img src="logo.png" alt="Logo">

<div class="cursor"></div>
<script>

    cursor.style.left=e.clientX+"px";

</html>
